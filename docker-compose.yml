services:
  db:
    profiles: ["core"]
    image: pgvector/pgvector:pg16
    container_name: cobalt_memory
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - cobalt_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: cobalt_viewer
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "18080:80"
    restart: always
    networks:
      - cobalt_net
    depends_on:
      - db

  mattermost:
    profiles: ["core"]
    image: mattermost/mattermost-enterprise-edition:latest
    platform: linux/amd64
    ports:
      - "8065:8065"
    environment:
      # RULED 2026-09-04: one database per product. Mattermost owns
      # `mattermost`; Cobalt keeps `cobalt_brain` (POSTGRES_DB) with its
      # name, its role and every plist value unchanged. Before the split
      # both products shared cobalt_brain, which is how a Cobalt
      # `CREATE TABLE jobs` silently hit Mattermost's 164k-row `jobs`.
      # The role is deliberately the SAME existing credential: no
      # Mattermost-specific Postgres role has ever existed on this host.
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${MATTERMOST_DB:-mattermost}?sslmode=disable&connect_timeout=10
    depends_on:
      - db
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
    restart: unless-stopped
    networks:
      - cobalt_net

networks:
  cobalt_net:
    driver: bridge

volumes:
  mattermost_config:
  mattermost_data:
