# F17 TASK INTEGRITY — the job registry (Charter §3 F17, L18).
#
# Schema: src/cobalt/jobs/config.py. Pydantic-validated on load; a bad
# row CRASHES with its label. `cobalt validate` cross-checks this file
# against ops/*.plist and fails on a job in one and not the other —
# a registry that has drifted from launchd is a registry that reports
# green for a job that no longer exists.
#
# ---------------------------------------------------------------------
# WHAT A ROW MEANS
# ---------------------------------------------------------------------
# label     : the launchd label, exactly. It is the join key everywhere.
# kind      : resident (runs continuously) | one-shot (runs and exits).
# supervisor: WHO stamps `heartbeat_at`, and this is the honest part —
#             `self`    Cobalt's own code, through the wrapper
#                       (src/cobalt/jobs/wrapper.py). The process says it
#                       is alive because it IS alive and running our code.
#             `launchd` launchd holds a live PID for it. Cobalt does not
#                       run inside it (Obsidian, the LM Studio server) or
#                       does not want a heartbeat thread in it (the ASET
#                       sheet). The WATCHDOG stamps from a real
#                       `launchctl` probe, and the row says so, so nothing
#                       pretends the process reported in itself.
#             `pidfile` the process is not launchd's own child — see
#                       com.cobalt.agent below.
# enabled   : is this plist supposed to be LOADED in launchd right now?
#             Defaults true, which is what every row has always meant.
#             `false` is the declared case of a job that is built,
#             registered and reviewable but NOT yet handed over — the
#             sweep reports it and probes nothing, so a deliberate state
#             never shows up as a standing red.
# timeout_s : how long a run may take before a stale heartbeat means
#             ZOMBIE. The wrapper stamps at least every timeout_s/3.
# schedule  : mirrors the plist. launchd cannot read this file and this
#             file cannot read launchd, so `cobalt validate` compares
#             them and a drift is loud.
jobs:
  # ---------------- residents ----------------
  - label: com.cobalt.aset
    kind: resident
    supervisor: launchd
    # The ASET sheet (ops/start_aset.sh -> uvicorn). It is Cobalt's own
    # code, but it is a request-driven server: a heartbeat thread inside
    # it would report "the process exists", which is exactly what the
    # launchd probe already reports, and F18 additionally probes the
    # sheet's HTTP 200 — which is the thing that actually matters and
    # that a thread could not tell us (S1-P2 watched this process serve
    # 500s while perfectly alive).
    timeout_s: 300
    # WHAT THIS PROCESS RE-READS ON EVERY REQUEST — derived by measuring
    # the request path (instrumented `open`/`read_text` over GET / and
    # GET /api/health), not by reading config names off a shelf. Each
    # entry cites its loader call in the 2026-09-09 ops report.
    #
    # It is the reason the field exists. On 09-08 a deploy added a
    # `TunableUnit.WINDOW` row to tunables.yaml and said "nothing else is
    # restarted"; this process re-read the new file through code that
    # predated the enum value, and from ~19:00 to 07:06 the page he
    # trades beside answered HTTP 200 and refused every card.
    #
    # NOT LISTED, and the omission is the point: `configs/dev/vault.yaml`
    # IS re-read per request in dev (cobalt/vault.py:167) but NOT in
    # production, where COBALT_VAULT_PATH is set in this job's own plist
    # and the resolver returns before it reads the file. A row here that
    # is only true in dev would send an operator to restart the sheet for
    # a file production never opens.
    reads:
      - "configs/dev/aset.yaml"                    # aset/config.py:134 (load_config); the name says dev, but there is no configs/cobalt/aset.yaml — this IS the production sheet's config
      - "configs/cobalt/taxonomy/tunables.yaml"    # taxonomy/loader.py:79 (load_tunables); the 09-09 R1 case
      # voice/config.py load_voice_config — the FINAL §5 backup refusal; read at the voice config's load, which the resident caches (voice/web.py _CONFIG), so a change reaches it only by restart — L42; voice V1 fix r2
      # Moved from no_resident_reads (the schema refuses a path in both). Its one-shot readers, provenance kept:
      # load_backup_config() (backup/config.py:161) is called by backup/restic.py:164,248,269 and backup/cli.py:59
      # (com.cobalt.backup, ops/run_backup.sh:39; status/restore are operator commands) and by heartbeat/probes.py:431
      # (backup_freshness, from runner.py:144 — com.cobalt.heartbeat). One-shots derive nothing. Added there 2026-09-22.
      - "configs/cobalt/backup.yaml"
      # DRC D3 ([F-28], F41): the DRC build runs IN THIS PROCESS (the /drc drop's request calls
      # cobalt.drc.build.run_drc_build) and its rules unit calls regenerate_rules_config()
      # (prefill/rules_gen.py), which writes this generated file. Moved from no_resident_reads (the schema
      # refuses a path in both); its one-shot reader, provenance kept: prefill/daily.py (com.cobalt.prefill-daily).
      - "configs/cobalt/rules.yaml"
      - "configs/cobalt/prefill.yaml"              # prefill/config.py:157 (load_prefill_paths), called from aset/web.py:1034 at the fill
      # voice V1's six paths, classified at the stack seam build 2026-09-25 (L42). The sheet serves voice
      # (aset/web.py:90 include_router(voice_web.router)), so this process runs voice's loaders.
      - "configs/cobalt/voice.yaml"                # voice/config.py:32 CONFIG_PATH + :120 (load_voice_config); cached per process in voice/web.py:59 _CONFIG, so a change reaches the sheet only by restart
      - "configs/cobalt/agents/voice.yaml"         # voice/registry.py:23 CONFIG_PATH + :85 (load_agent), called from voice/web.py:176
      - "configs/cobalt/modelaccess.yaml"          # modelaccess/config.py:28 CONFIG_PATH + :106 (load_routes), called from voice/web.py:176
      - "ops/start_aset.sh"                        # ops/com.cobalt.aset.plist:25 (the program); its exports (start_aset.sh:35, :37 COBALT_VOICE_*) reach the process only at a restart
      - "pyproject.toml"                           # ops/start_aset.sh:73 (exec uv run python -m cobalt.aset): uv syncs the environment from it when the process starts
      - "uv.lock"                                  # ops/start_aset.sh:73 (exec uv run python -m cobalt.aset): uv syncs the environment from it when the process starts
      # S4-P2 S5: the strike delivery numbers and the hotkey template. strike/delivery_config.py CONFIG_PATH +
      # load_delivery_config, called from aset/strike.py (the /strike page, each /strike/stream connect, and the
      # fallback thread's start in aset/__main__.py, which holds it for the life of the process) — L42.
      - "configs/cobalt/strike.yaml"
      # S4-P2 S4: the sheet's phone-fallback thread sends a DM: notify/mattermost.py:137 (send_dm) calls
      # load_notify_config() (notify/config.py:51) on every send. Moved from no_resident_reads (the schema refuses
      # a path in both); its one-shot reader, provenance kept: heartbeat/runner.py:304 (com.cobalt.heartbeat), and
      # `cobalt validate` (cli.py:285 import, :303 call — an operator command). Ruled there 2026-09-15.
      - "configs/cobalt/notify.yaml"
    imports: [cobalt.aset.__main__, cobalt.aset.web]
    what: "the ASET semi-auto sheet on :5010 — the surface he trades beside"

  - label: com.cobalt.mainframe
    kind: resident
    supervisor: launchd
    timeout_s: 600
    # EMPTY, derived: LM Studio is not Cobalt code and reads its own
    # `~/.lmstudio/` config, which is not repo-relative. Nothing in
    # configs/ reaches this process.
    reads: []
    imports: []
    what: "the LM Studio local-model server (ops/start_mainframe.sh), the L23 local lane"

  - label: com.cobalt.obsidian
    kind: resident
    supervisor: launchd
    timeout_s: 300
    what: >
      Obsidian as a supervised service (RULING 6). Not decoration: the
      vault reaches his other devices only through a RUNNING Obsidian on
      this Mac, and on 09-04 a correct 05:15 write was silently
      overwritten because none was running.
    # EMPTY, derived: Obsidian is a third-party app. It reads the vault's
    # own .obsidian/ directory, never configs/.
    reads: []
    imports: []

  - label: com.cobalt.agent
    kind: resident
    supervisor: pidfile
    pidfile: logs/cobalt.pid
    timeout_s: 600
    # WHAT com.cobalt.agent IS (S1-P3 answer to the prompt's question).
    # It is the OLD TREE's agent: the plist runs `cobalt.sh start`, which
    # pre-flight-checks LM Studio/Postgres/Mattermost and then
    # `nohup uv run src/cobalt_agent/main.py &` — the Mattermost
    # websocket listener, the scheduler, the Scribe, the memory layer.
    #
    # It is registered as `pidfile` and not `launchd` because of a real
    # shape, not a preference: cobalt.sh spawns the agent detached
    # (`nohup`, and the plist sets AbandonProcessGroup) and EXITS 0. So
    # launchd sees a one-shot that completed successfully and holds no
    # PID — `launchctl list` shows `- 0` for this label whether the agent
    # is running or dead. The only truthful liveness signal is the PID
    # file cobalt.sh writes.
    #
    # It gets a row because F18 must be able to say it is down; it gets
    # no wrapper because the strangler rule (CLAUDE.md) says the old tree
    # stays untouched and no new-core code is added to it.
    # NOT EMPTY since the stack seam fix r1 (2026-09-25): the two uv files below. The caveat stands: the old tree loads `configs/*.yaml`
    # ONCE into a singleton at first construction
    # (cobalt_agent/config.py:410) and `Config.load()` returns the cached
    # object thereafter — so it does not RE-READ anything, which is what
    # this field records. It still has to be restarted when one of those
    # files changes, because it is running the old values. That is the
    # read-once class; it wants its own field (09-09 ESCALATE).
    reads:
      - "pyproject.toml"                           # cobalt.sh:59 (nohup uv run src/cobalt_agent/main.py), started by ops/com.cobalt.agent.plist:25 (cobalt.sh start): uv syncs the environment from it when the process starts
      - "uv.lock"                                  # cobalt.sh:59 (nohup uv run src/cobalt_agent/main.py), started by ops/com.cobalt.agent.plist:25 (cobalt.sh start): uv syncs the environment from it when the process starts
    imports: [cobalt_agent.main]
    what: "the OLD-TREE agent (cobalt.sh start -> cobalt_agent/main.py), detached; liveness from its PID file"

  - label: com.cobalt.herdr
    kind: resident
    supervisor: launchd
    # BUILT, NOT LOADED (2026-09-08). See ops/com.cobalt.herdr.plist and
    # the "herdr handover" procedure in ops/README.md. The flag comes off
    # at the Mac keyboard, as the LAST step of that procedure, because
    # the server being registered is the one hosting the session that
    # would register it — bootstrapping it from inside a herdr pane takes
    # that pane down mid-command.
    enabled: true
    # INTERIM until the launchd handover above is done (ruled 2026-09-14,
    # option B): herdr is hand-started outside launchd, so the launchd
    # probe's "loaded, not running" rates AMBER "launchd unmanaged", never
    # RED. The `herdr` process/socket probe stays authoritative for
    # liveness. Remove this line as part of the handover.
    launchd_unmanaged: true
    # `launchd`, not `self`: herdr is not Cobalt code and will never
    # carry our wrapper. The watchdog probes launchctl and stamps on its
    # behalf, and the row says so, so nothing reads "the process exists"
    # as "the server is answering". The F18 probe `herdr` asks the
    # second question separately — socket + agent list — for the same
    # reason the ASET sheet gets an HTTP probe next to its PID probe.
    timeout_s: 300
    # EMPTY, derived: herdr is not Cobalt code. Its config is
    # `~/.config/herdr/config.toml` (and `herdr server reload-config`
    # re-reads it without a restart) — not repo-relative, so no deploy of
    # ours can change it.
    reads: []
    imports: []
    what: "the herdr server — the terminal workspace hosting every agent seat"

  - label: com.cobalt.radar
    kind: resident
    supervisor: self
    timeout_s: 300
    enabled: true
    reads:
      - "configs/cobalt/radar.yaml"                # radar/config.py:67 (load_config)
      - "configs/cobalt/taxonomy/tunables.yaml"    # taxonomy/loader.py:79 (load_tunables)
      - "pyproject.toml"                           # ops/com.cobalt.radar.plist:18–22 (uv run cobalt radar run): uv syncs the environment from it when the process starts
      - "uv.lock"                                  # ops/com.cobalt.radar.plist:18–22 (uv run cobalt radar run): uv syncs the environment from it when the process starts
    imports: [cobalt.cli]
    what: "the resident radar pool scanner and Finviz i1 bar poller"

  - label: com.cobalt.cos
    kind: resident
    supervisor: self
    # F20: BUILT, REGISTERED, NOT HANDED OVER (card 730 DECISION 6;
    # BOOTSTRAP deferred). It refuses to start while com.cobalt.agent's
    # pidfile is alive (F-14), and its deploy waits for the D14 checklist,
    # T10 and X1. `self`: the LOOP stamps heartbeat_at at the top of every
    # iteration (cos/run.py, no beater thread), so a hung poll goes ZOMBIE.
    enabled: false
    # > cos.turn_timeout_s (900) + one cos.poll_interval_s (no value yet;
    # 60 s UNMEASURED stand-in, DECISION 7): a turn in flight is never ZOMBIE.
    timeout_s: 1200
    reads:
      - "configs/cobalt/agents/cos.yaml"           # agents/registry.py:93 (load_entry), called from cos/run.py:87 (_build) at the start: model + charter held for the life of the process
      - "configs/cobalt/agents/voice.yaml"         # agents/registry.py:125 (list_agents reads it by id), called from cos/tools.py:68 (_agents_list) on each agents.list call
      - "configs/cobalt/taxonomy/tunables.yaml"    # taxonomy/loader.py:79 (load_tunables), from cos/session.py:80 (tunable_int) and hitl/actions.py:66 (request_ttl_min) on each request
      - "configs/cobalt/notify.yaml"               # notify/config.py:51 (load_notify_config), from notify/mattermost.py:137 (send_dm) on every card, reply and failure DM, and cos/listener.py:53 (fetch_dm_posts) on every poll
      - "ops/start_cos.sh"                         # ops/com.cobalt.cos.plist:21 (the program); its exports reach the process only at a restart
      - "pyproject.toml"                           # ops/start_cos.sh:31 (uv sync --inexact, then exec): the environment is synced from it when the process starts
      - "uv.lock"                                  # ops/start_cos.sh:31 (uv sync --inexact, then exec): the environment is synced from it when the process starts
    imports: [cobalt.cos.run]
    what: "the F20 chief of staff — one Agent SDK session he talks to in his Mattermost DM; HITL executor"

  # ---------------- one-shots ----------------
  - label: com.cobalt.prefill-daily
    kind: one-shot
    supervisor: self
    timeout_s: 600
    schedule: {at: "05:15", weekdays: [1, 2, 3, 4, 5]}
    what: "the morning daily-note prefill (uv run prefill daily)"

  - label: com.cobalt.prefill-refresh
    kind: one-shot
    supervisor: self
    timeout_s: 300
    # F4 (FINAL §4.2): an INTERVAL inside a WINDOW, both from tunables rows,
    # the seat-usage shape; the plist carries the window expanded into one
    # StartCalendarInterval entry per firing (Schedule.calendar_entries()).
    # It reads configs/cobalt/prefill.yaml (daily_refresh), tunables.yaml and
    # templates/daily.md.j2 on every run — written here, not as `reads:`,
    # which the schema refuses on a one-shot (a one-shot re-reads every run).
    schedule:
      every_min_tunable: prefill.refresh_interval_min
      window_tunable: prefill.refresh_window
      weekdays: [1, 2, 3, 4, 5]
    what: "the daily-note refresh, trading + calendar units all day (uv run prefill refresh)"

  # F5 (FINAL §2.8, card 731 K9): the four market-context checkpoints, one
  # one-shot per slot (Charter:50; prefill.yaml checkpoints.slots, the parity
  # test tests/cobalt/test_checkpoints_registry.py). timeout_s 300: card 731
  # DECISION 4, UNMEASURED — above the route's provisional 60 s plus two 30 s
  # fetches; re-checked once X3's measured route timeout lands.
  - label: com.cobalt.checkpoint-0715
    kind: one-shot
    supervisor: self
    timeout_s: 300
    schedule: {at: "07:15", weekdays: [1, 2, 3, 4, 5]}
    what: "the 07:15 market-context checkpoint (uv run cobalt checkpoint run --slot 0715)"

  - label: com.cobalt.checkpoint-0745
    kind: one-shot
    supervisor: self
    timeout_s: 300
    schedule: {at: "07:45", weekdays: [1, 2, 3, 4, 5]}
    what: "the 07:45 market-context checkpoint (uv run cobalt checkpoint run --slot 0745)"

  - label: com.cobalt.checkpoint-0815
    kind: one-shot
    supervisor: self
    timeout_s: 300
    schedule: {at: "08:15", weekdays: [1, 2, 3, 4, 5]}
    what: "the 08:15 market-context checkpoint (uv run cobalt checkpoint run --slot 0815)"

  - label: com.cobalt.checkpoint-0845
    kind: one-shot
    supervisor: self
    timeout_s: 300
    schedule: {at: "08:45", weekdays: [1, 2, 3, 4, 5]}
    what: "the 08:45 market-context checkpoint (uv run cobalt checkpoint run --slot 0845)"

  - label: com.cobalt.archiver
    kind: one-shot
    supervisor: self
    # The nightly full run took 23m04s and 23m11s on the last two nights.
    # 2400 s (40 min) is not a target and does not kill a healthy long
    # run: it is the END OF THE DECLARED DEMAND WINDOW, 20:30 -> 21:10,
    # which the L53 total-demand gate reads as this job's Finviz window
    # (S2-P4 R17). The watchdog flags ZOMBIE only past that AND with a
    # stale heartbeat, so a slow-but-beating night is never cut.
    timeout_s: 2400
    schedule: {at: "20:30", weekdays: [1, 2, 3, 4, 5]}
    what: "the Bar Archiver nightly full run (uv run archiver)"

  - label: com.cobalt.replay
    kind: one-shot
    supervisor: self
    # S2-P4 R3, moved 21:05 -> 21:10 by R17. After the 20:00-21:00 reset
    # and after the 20:30 archiver, which it refuses to run without
    # (tonight's occurrence, done, exit 0) — and now also after the
    # archiver's DECLARED WINDOW ENDS at 21:10, so the two Finviz windows
    # are disjoint and neither counts the other's rpm against the
    # ceiling. 30 minutes bounds a stall; the run's own enforced deadline
    # (replay.backup_margin_s before the 21:40 backup) bounds a healthy
    # long run.
    timeout_s: 1800
    schedule: {at: "21:10", weekdays: [1, 2, 3, 4, 5]}
    what: "the nightly replay — movers, card misses + counterfactual R, the DRC miss line (uv run cobalt replay nightly)"

  - label: com.cobalt.cards-expire
    kind: one-shot
    supervisor: self
    timeout_s: 300
    schedule: {at: "16:05", weekdays: [1, 2, 3, 4, 5]}
    what: "expire cards whose window closed (uv run cobalt cards expire)"

  - label: com.cobalt.daymode-propose
    kind: one-shot
    supervisor: self
    timeout_s: 300
    schedule: {at: "09:00", weekdays: [1, 2, 3, 4, 5]}
    what: "the 09:00 day-mode proposal (uv run cobalt daymode propose)"

  - label: com.cobalt.backup
    kind: one-shot
    supervisor: self
    # An hour. The first real snapshot took minutes, but the number that
    # matters is the one a FULL re-read takes on a bad night — restic
    # rescans every source file when its cache is cold, and the dump
    # alone is 360 MB.
    timeout_s: 3600
    # EVERY day including weekends, and after the archiver's 20:30 (which
    # takes ~23 min) so the snapshot contains that night's bars rather
    # than racing them. A vault edit on a Saturday is exactly as
    # unrecoverable as one on a Tuesday.
    schedule: {at: "21:40", weekdays: [0, 1, 2, 3, 4, 5, 6]}
    what: "the nightly restic snapshot — vault + a fresh cobalt_brain dump, to the SSD"

  - label: com.cobalt.heartbeat
    kind: one-shot
    supervisor: self
    # The watcher keeps running while the stop is active so the stop itself,
    # and anything else that is down, remains visible. Validation permits
    # this exemption on this label only.
    kill_switch_exempt: true
    timeout_s: 300
    # EVERY interval, all week. The heartbeat is the thing that notices a
    # weekend failure before Monday morning needs it.
    schedule: {every_min_tunable: heartbeat.interval_min}
    what: "the F18 heartbeat host — probes everything above and says so out loud"

  - label: com.cobalt.seat-usage
    kind: one-shot
    supervisor: self
    timeout_s: 300
    # An INTERVAL inside a WINDOW, both from tunables rows (F16). launchd
    # has no such shape natively, so the plist carries the window expanded
    # into one StartCalendarInterval entry per firing and the suite
    # compares the two — see Schedule.calendar_entries().
    schedule:
      every_min_tunable: seat_usage.interval_min
      window_tunable: seat_usage.window
      weekdays: [0, 1, 2, 3, 4, 5, 6]
    what: "the hourly seat-usage report (uv run cobalt seat-usage run) — what the seats cost today"

  - label: com.cobalt.generated
    kind: one-shot
    supervisor: self
    timeout_s: 300
    # 23:37 ET, EVERY DAY. After the last seat-usage run (23:00) and well
    # after the archiver's 20:30 + the backup's 21:40, so the day's
    # rewrites are all on disk before this looks. Not on the hour, and
    # not on a round five: a scheduled `git add` should not share its
    # minute with anything, and an odd minute is the cheapest way to say
    # so. Weekends included — the seat-usage report is rewritten on a
    # Saturday exactly as it is on a Tuesday.
    schedule: {at: "23:37", weekdays: [0, 1, 2, 3, 4, 5, 6]}
    what: >
      commit the generated files a job rewrote today (uv run cobalt
      generated commit). configs/cobalt/generated.yaml is the declared
      list; the command refuses off `main`, mid-merge, or with anything
      already staged, and it NEVER pushes. It exists because ~/cobalt IS
      production and a permanently dirty working tree is one nobody
      reads.

  - label: com.cobalt.playbook
    kind: one-shot
    supervisor: self
    timeout_s: 600
    # Sunday 17:30 ET, so the decks exist when the 18:00 weekly review
    # opens (F23 FINAL C7, Charter M11). One read of the strategy notes and
    # one SELECT of the radar cards; it writes data/playbook/<date>/ and
    # this row only — never the vault. Card 503 (DECISION D3): enabled,
    # bootstrap deferred to the deploy (card 496's owed-label state file).
    schedule: {at: "17:30", weekdays: [0]}
    enabled: true
    what: "the Sunday playbook decks, one .pptx per setup family (uv run cobalt playbook render)"

# ---------------------------------------------------------------------
# NO RESIDENT READS (ruled 2026-09-15)
# ---------------------------------------------------------------------
# A repo file that only ONE-SHOTS read at runtime. A one-shot re-reads
# everything every run, so a change to it derives NO restart — but that
# is a claim about the code, so it is written down here, derived with
# file:line, instead of left unlisted (UNKNOWN to `cobalt jobs readers`,
# ESCALATE to `cobalt jobs restarts`). The schema refuses a resident as a
# reader: a resident reader belongs in that job's own `reads`.
no_resident_reads:
  # configs/cobalt/notify.yaml LEFT this list in S4-P2 S4: the sheet's phone-fallback
  # thread sends a DM inside com.cobalt.aset — it is now in that job's `reads:`.
  - path: configs/cobalt/templates/daily.md.j2
    readers: [com.cobalt.prefill-daily, com.cobalt.prefill-refresh, com.cobalt.checkpoint-0715, com.cobalt.checkpoint-0745, com.cobalt.checkpoint-0815, com.cobalt.checkpoint-0845]
    because: >
      Loaded only by prefill/daily.py:239 (env.get_template("daily.md.j2"),
      FileSystemLoader(TEMPLATES_DIR) at :238), the com.cobalt.prefill-daily
      one-shot. No resident renders it. Ruled 2026-09-30. F5 (card 731 K9):
      the four checkpoint one-shots render it through ensure_daily_note when
      the day's note is absent.
  - path: configs/cobalt/templates/drc.md.j2
    readers: [com.cobalt.prefill-daily]
    because: >
      DRC D3 deleted this template. No code loads it: the two remaining
      mentions are prose (prefill/drc.py:6, a docstring; daymode/drc.py:121,
      a comment). Its one reader was the retired 15:40 DRC prefill job.
      com.cobalt.prefill-daily is the one job whose loader reaches
      configs/cobalt/templates/ (prefill/daily.py:238, FileSystemLoader(TEMPLATES_DIR)).
      Ruled 2026-09-30.
  - path: configs/cobalt/classify/trial.yaml
    readers: [com.cobalt.generated]
    because: >
      Read only by classify/config.py:40 CONFIG_PATH + load_trial_config, called
      from the manual `cobalt classify` commands (classify/cli.py, route.py
      load_route_config). No job runs `cobalt classify`; no resident loads it.
      com.cobalt.generated is named because the schema needs a registered
      one-shot: its `uv run cobalt` process imports the loader (cobalt.cli ->
      cobalt.classify.cli) without calling it, the drc.md.j2 precedent.
      Card 591, 2026-10-15.
  - path: configs/cobalt/classify/route.yaml
