# NIGHTLY BACKUP — restic (RULED: "restic → B2 + SSD, NOT Time Machine",
# ledger 2026-09-04). Schema: src/cobalt/backup/config.py, Pydantic-
# validated on load; a bad row CRASHES. No credential is ever written
# here: the repository password and the B2 keys are named by VAULT KEY
# only, exactly as configs/cobalt/notify.yaml names MATTERMOST_CREDS.
#
# ---------------------------------------------------------------------
# STATE: ssd ARMED (2026-09-05), b2 STILL OFF
# ---------------------------------------------------------------------
# The ruling names two destinations.
#   ssd — ARMED. A 500 GB APFS volume (physical disk4, synthesized
#         disk5s1) is mounted at /Volumes/COBALT-BACKUP and holds the
#         repository. com.cobalt.backup is loaded and runs 21:40 daily.
#   b2  — STILL OFF. The vault holds no B2 key id, application key or
#         bucket name. The leg stays configured and disabled so that
#         arming it is one `enabled: true` and a `repo`, reviewable as a
#         diff, rather than a config someone writes from scratch under
#         pressure. Until it exists there is ONE copy of the corpus, on
#         a disk sitting next to the machine it protects.
#
# THE `requires_mount` GUARD, and why every removable repo needs one.
# With the SSD unplugged, /Volumes/COBALT-BACKUP does not exist — and
# restic, mkdir and the shell will all happily CREATE it on the boot
# disk. The nightly job would then back the boot disk up to itself,
# exit 0 and paint the heartbeat green, with no error anywhere until the
# day the Mac dies. `requires_mount` is checked with os.path.ismount
# before the dump is even taken; unmounted = loud failure naming the
# disk to plug in, never a fallback. The schema REFUSES a local repo
# under /Volumes/ that declares no mount.
#
# `cobalt backup run` still REFUSES to run with zero enabled
# destinations rather than exiting 0 having written nothing.
backup:
  # ---------------- what is protected ----------------
  # The vault is the irreplaceable half: Postgres can be rebuilt from
  # Finviz history, a hand-written trade note cannot.
  sources:
    - /Users/cobalt/Vault/Think

  # A FRESH dump, taken inside the snapshot, not a file lying on disk
  # from some earlier night. `cobalt_brain` only — cobalt_dev is by
  # definition reproducible (RULING 7) and `mattermost` is a product
  # database with its own recovery story (ADR-0006, 2026-09-04 section).
  database:
    enabled: true
    name: cobalt_brain

  # Obsidian rewrites workspace.json on every pane change; backing it up
  # makes every snapshot differ for a reason nobody cares about.
  excludes:
    - ".DS_Store"
    - ".obsidian/workspace.json"
    - ".obsidian/workspace-mobile.json"
    - ".trash"
    - "*.tmp"

  destinations:
    - name: ssd
      kind: local
      repo: "/Volumes/COBALT-BACKUP/restic"
      # The volume that must be mounted for the repo above to be real.
      # Mandatory for any local repo under /Volumes/ — see the header.
      requires_mount: "/Volumes/COBALT-BACKUP"
      enabled: true
    - name: b2
      kind: b2
      repo: ""
      enabled: false

  # Vault key names only — never the values.
  password_vault_key: RESTIC_PASSWORD
  b2_key_id_vault_key: B2_ACCOUNT_ID
  b2_app_key_vault_key: B2_ACCOUNT_KEY

  # Retention, as ruled. `forget --prune` runs after every snapshot so a
  # repository cannot grow without bound between reviews.
  forget:
    daily: 14
    weekly: 8
    monthly: 12
