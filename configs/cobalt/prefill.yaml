# Slice 2 (DRC & Daily prefill engine) — shared new-core data, same
# boundary class as watchlists.yaml (TRIAGE config boundary: not a
# per-developer setting, Dejan's actual vault folder layout). The daily
# note's own directory/filename pattern is NOT duplicated here — it
# already lives in configs/dev/aset*.yaml's `daily_note:` block and the
# prefill engine reads that directly (one-path rule).
prefill:
  trades_dir: "1 - Trading/2 - Trades"
  review_dir: "1 - Trading/5 - Review"
  drc_filename_pattern: "DRC-%Y-%m-%d.md"
  # DRC D3 ([F-20], R65 d): HIS template, relative to the vault root — the
  # one template the DRC build reads (only `{{date:YYYY-MM-DD}}` replaced).
  drc_template: "5 - Templates/DRC.md"
  # {ticker} is filled in by trade_note.py, not strftime — the rest of
  # the pattern IS strftime (matches the vault's own Templater-authored
  # filenames exactly, e.g. "Trade-2025-09-24 12-51-52 -MU.md").
  trade_filename_pattern: "Trade-%Y-%m-%d %H-%M-%S -{ticker}.md"

# F4 (FINAL §4.3, §4.6): what `prefill refresh` re-renders all day, and who
# owns each market-table field. Loaded only by `DailyRefreshConfig`
# (src/cobalt/prefill/config.py), which refuses any other unit, any other
# field, an owner other than cobalt|manual, and VIX/BTC as `cobalt` (no
# source can serve them yet).
daily_refresh:
  units: [trading/market_table, market_calendar/market_calendar]
  fields: {SPY: cobalt, QQQ: cobalt, IWM: cobalt, VIX: manual, BTC: manual}

# F5 (FINAL §4 Config, [F-09]): the four market-context checkpoints. Loaded
# only by `CheckpointsConfig` (src/cobalt/prefill/config.py): every key
# required, any other key refused. The slot times are his (Charter:50, M3);
# jobs.yaml's four `at` values and the four plists must equal them
# (tests/cobalt/test_checkpoints_registry.py).
checkpoints:
  slots: ["07:15", "07:45", "08:15", "08:45"]
  source: ruling
  indices: [SPY, QQQ, IWM]
  groups: {g: sector, v: 140}
  route: checkpoint.narrative
  narrative_max_lines: 3
  section: market_context
  heading: "### Market Context:"
