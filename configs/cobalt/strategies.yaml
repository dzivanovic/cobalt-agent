# Strategy taxonomy tags — config-as-code, not hardcoded in drc.py.
# `reversion: true` marks strategies whose entry thesis is "price is
# exhausted, expect it to turn" rather than "price is moving, expect it
# to continue" — these are the ones the DRC's excitement-audit question
# (Ledger 08-27: "excitement-audit on reversion cards") applies to.
#
# SEED LIST: names come verbatim from the Individual Trade Template's
# own Strategy dropdown (5 - Templates/Individual Trade Template.md);
# the reversion/continuation split below is Cobalt's best-guess reading
# of each name, NOT Dejan-confirmed — correct via this file, not code,
# the first time a tag looks wrong. Any strategy not listed here is
# treated as reversion: false (no audit question), never a guess either
# way beyond what's written.
strategies:
