# MODEL-ACCESS ROUTE REGISTRY — the new core's ONE model-access module
# (voice v3 seam S1, docs/30 - Design/VOICE-v3-SEAM-S1-2026-09-23.md §2.3).
# Schema: src/cobalt/modelaccess/config.py (extra="forbid"; every key is
# REQUIRED — a missing key crashes the load, L1/L10).
#
# A caller names a ROUTE; it never sees a URL, a key, a provider or a model
# file. V1 accepts one lane (local), one kind (openai_compatible), one think
# policy (forbid_nonempty); a local route must point at a LOOPBACK host.
#
# There is NO `fallback` key and the schema refuses one: whether any lane
# carries a fallback is the routing lane's (L23 / L25, frozen until the
# routing tribunal rules — FINAL [F-23]). The routing build extends THIS
# file; it never builds a second registry.
#
# Lives under configs/cobalt/ — outside the old loader's top-level
# configs/*.yaml glob (CLAUDE.md config boundary).
routes:
  local.plan:
    lane: local
    kind: openai_compatible
    # LM Studio's OpenAI-compatible server (heartbeat/probes.py `mainframe`).
    api_base: http://127.0.0.1:1234/v1
    # The LM Studio alias; ModelResult.model_returned records what the
    # server actually answered with.
    model: mainframe
    # Append the `/no_think` soft switch to the last user message (FINAL F8).
    no_think: true
    # An empty <think> block is removed and recorded; a non-empty one FAILS
    # the call (think_leak) — the turn never executes (seam §2.4 (2)).
    think_policy: forbid_nonempty
    # source: X-E4 (build report ### X-E4) — solo p95 3146 ms, max 3486 ms over 65
    # Plan calls; 15 s ≈ 4× the max. Contended calls queued 60–72 s behind a
    # second client and FAIL here loud (timeout) instead of hanging a turn.
    timeout_s: 15
    # source: X-E4 — Plans used 23–48 output tokens; 256 is ≈ 5× the largest.
    max_output_tokens: 256
    # source: X-E4 — the server accepted response_format json_schema (no 4xx)
    # and 65/65 replies parsed as a Plan (the caller validates anyway).
    response_format: json_schema
    # LM Studio needs no key today. If it ever does: a VaultManager NAME,
    # fetched at call time — never a value (L4).
    key_name: null
  # F21 chunk 2 (card 469 V3; FINAL F-01, F-03, F-15): the embeddings kind,
  # its own Route variant (EmbedRoute) — no chat keys, no fallback. Used by
  # the one-shot `cobalt genesis embed`; never by the voice path.
  local.embed:
    lane: local
    kind: openai_embeddings
    # The same LM Studio server as local.plan.
    api_base: http://127.0.0.1:1234/v1
    # source: X2 and X8 (reports/f21-host-probe-r2-2026-10-13.md) — listed by
    # /v1/models, returned as `model` on 130/130 calls. embed_sync refuses a
    # reply naming any other model (X8: an unknown alias answered 200 with this one).
    model: text-embedding-nomic-embed-text-v1.5
    # source: X2 first call (JIT load plus answer in 7.5 s) against X8 loaded
    # max 340 ms (reports/f21-host-probe-r2-2026-10-13.md), and X8 unloaded
    # (JIT load plus 32 strings answered 200 in 0.86 s,
    # reports/f21-x8-probe-2026-10-18.md); 30 s ≈ 4× the slowest seen.
    timeout_s: 30
    # source: X2 and X8 (reports/f21-host-probe-r2-2026-10-13.md) — dims=[768]
    # on every vector, no zero vector. Checked against genesis_chunk.embedding's
    # declared dimension at load (F-02).
    dim: 768
    key_name: null

  # F5 (FINAL §2.5, §4, D1): the checkpoint narrative — ONE call per slot run,
  # its input the filtered delta list only, its reply indexed phrases only
  # ([F-08]); a timeout degrades the narrative, never the numbers. Same lane,
  # server and model as local.plan; no fallback (L25).
  checkpoint.narrative:
    lane: local
    kind: openai_compatible
    api_base: http://127.0.0.1:1234/v1
    model: mainframe
    no_think: true
    think_policy: forbid_nonempty
    # source: X3 reports/f5-x3-measure-2026-10-20.md warm p95 3.53 s / max 4.97 s + cold load 8.67 s from the mainframe log (proxy, not a live cold call); rule max(2×p95, cold×1.5) up 5 s
    timeout_s: 25
    # source: X3 reports/f5-x3-measure-2026-10-20.md (warm model)
    max_output_tokens: 256
    response_format: json_schema
    key_name: null
