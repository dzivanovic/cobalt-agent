# VERIFIED 2026-09-10 (hub): required_headers and metric_headers confirmed
# byte-for-byte against a real /export/screener header capture (fixture
# filter exch_nasd,sh_avgvol_o500, 1809 rows, cache
# data/radar-cache/2026-09-10/screen-example_session_scan-214943.csv).
# not_equity is R16 "C", ruled 2026-09-19 on the evidence run over the
# retained exports: 5,702 distinct fund tickers, 28 distinct non-blank
# `Asset Type` values, every one of them on an ETF-industry row (0 stock
# rows hit), and 8 distinct funds carrying a BLANK `Asset Type` — table
# C(ii) = 16 rows. So neither column names a fund on its own: a row is
# dropped when `Asset Type` is non-blank OR `Industry` is a fund
# industry. Counts and their source:
# docs/40 - DevDocs/reports/s2-p4-verify-2026-09-19.md §2.2.
# Both columns are read on every row, so both are required_headers.
pool_key: primary
notes:
  screens: "1 - Trading/Radar Screens.md"
  lists: "1 - Trading/Radar Lists.md"
export:
  v: 152
  columns: "0-150"
  required_headers: [Ticker, Volume, Relative Volume, Asset Type, Industry]
  metric_headers:
    volume: Volume
    rvol: Relative Volume
list_chunk_size: 50
not_equity:
  asset_type_header: Asset Type
  industry_header: Industry
  industry_values: [Exchange Traded Fund]
cache:
  dir: data/radar-cache
  retention_days: 7
# S2-P2: market/sector context tickers for the alignment shadow dots. Empty
# until the hub's STEP-0 read verifies bar coverage and the sector map; an
# empty list is counted as zero demand and the alignment dots render
# CHECKPOINT_MISSING. Every ticker here counts against radar.finviz_max_rpm.
context:
  tickers: []
