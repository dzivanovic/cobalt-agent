# ASET sheet-mode fixed-dollar risk (iteration 4, ruled by Dejan
# 2026-08-28; grade-ladder completion, same day).
#
# full/half A and B are typed straight from Dejan's two DAS Trader Pro
# hotkey files (full-day vs. half-day key sets) and must be changed only
# by re-checking those files, never by recomputing.
#
# A+ and C are derived from the canonical ASET percentage map (A+ 80% /
# C 5%) at the same bases as A/B, so the full ladder stays internally
# consistent even though A+ and C aren't live yet. D is always $0 — the
# SAW principle ("too risky to feel like a C? It's not a C — it's a SAW
# trade") — and src/cobalt/aset/config.py enforces D == 0 at load time,
# not just by convention here.
#
# enabled_grades controls which grades the sheet actually offers/
# computes — separate from the dollar truth above. A+ activates only
# once the grading system exists to justify it; C returns when the
# coach program reopens the testing-and-learning tier. Enabling a grade
# is a config edit here, never a code change.
#
# The real risk ceiling is 1% of account (dynamic — grows with the
# account as it compounds). Fixed dollars here are an interim
# pro-mirror mode matching what Dejan's hotkeys already do by hand; a
# computed 1%-of-account mode returns later once the fixed-dollar sheet
# has been lived with for a while (AsetConfig.account_size is kept
# around for that future mode — see src/cobalt/aset/config.py).
#
# SHEETS ARE AN ORDERED LIST, NOT A FIXED PAIR (ruled 2026-09-04, S1-P2
# F6). `sheets` is keyed by sheet id and `order` lists the rungs LOW to
# HIGH. A quarter sheet arrives as a config row here plus its .htk file
# and its entry in configs/cobalt/daymode.yaml's hotkey_files — no code
# change anywhere. Nothing in src/ names `full` or `half` as a literal
# any more, and nothing counts them.
sheet_modes:
  # Low -> high. F6's day-mode ladder and the "lowest enabled sheet"
  # premarket floor both read this order.
  order: [half, full]
  sheets:
    half:
      A_plus: 170
      A: 70
      B: 30
      C: 11
      D: 0
    full:
      A_plus: 345
      A: 135
      B: 60
      C: 21
      D: 0
  # The account-wide grade ladder. The REDUCED RUNG narrows it further
  # to [B] via daymode.yaml's `reduced_enabled_grades` — that is a
  # day-mode restriction, not a change to what the account permits, so
  # it lives there and not here.
  enabled_grades: [A, B]
