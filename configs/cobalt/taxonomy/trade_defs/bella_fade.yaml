# Source: TRADE-DEFS-BATCH2-v0_1.md §B.6 (SMB Bella Fade sheet).
# Schema: TAXONOMY-DRAFT-v0_6.md §10.1 (schema v0.3) + §A amendments
# (v0.7 extensions, TRADE-DEFS-BATCH2-v0_1.md §A).
trade_def:
  id: bella_fade
  name: Bella Fade
  aliases: [Bella]
  family: [opening_drive, reversion]
  class: move2move  # "two waves" = hold through the pullback for leg 2
  valid_setups:
    - {setup_ref: gap_down_into_support, relation: countertrend}
    - {setup_ref: gap_up_into_resistance, relation: countertrend}
    - {setup_ref: day2_continuation, relation: with_trend}
    - {setup_ref: overextension, relation: countertrend}
    - {setup_ref: volatility_in_range, relation: countertrend}
    - {setup_ref: range_break, relation: with_trend}
  entry_mode: front_side
  preconditions:
    - expr: "Leg(opening_drive).direction == opposite(trade_direction)"  # the institutional order's move
    - expr: "InPlay.state == active"
    - expr: "Catalyst.grade <= 8"  # avoid entirely if the catalyst is more than an 8
  trigger:
    type: trendline_break
    params:
      ref: "Level_ref(trendline)"
      anchor_leg: "Leg(opening_drive)"
      pivots: 2  # config
    confirmation_policy: {type: intrabar}  # "aggressively on the trendline break"
  stop:
    placement:
      type: structural_extreme
      ref: turn_low
      buffer: {type: fixed, cents: {value: 0.02, dynamic: false}}  # sheet 0.01 -> RULED 0.02 (A.6)
      floor: config
    evaluation: touch
  stop_management:
    - type: fixed
      "on": {name: entry}
  exit:
    - fraction: 0.5
      target_type: leg_end
      params: {leg_index: 1}
      evaluation: touch
      computable: cobalt  # "half into the first wave"
    - fraction: 0.5
      target_type: leg_end
      params: {leg_index: 2}
      evaluation: touch
      computable: cobalt  # "the other half into the second wave"
  on_cic: {triggers: [1, 2, 3, 4], action: exit_all}   # advisory
  max_attempts: {value: 2, dynamic: false, note: "sheet: two tries — breaks the LOD but rebids immediately; rules gate intersects 08-27"}
  add_policy: {type: none}
  avoid:
    - expr: "RangeBreak(Level_ref(HTF)).state == accepted AND against(trade_direction)"  # "breaking a strong technical level" / "breaks support"
    - expr: "Range(micro) near turn_low AND Range.duration > threshold"  # config — "consolidates near the lows for long = selling pressure remains"
    - expr: "Catalyst.polarity == against(trade_direction)"  # "negative catalyst weighing on the stock"
  quality_factors:
    - tape_flip
    - speed_away_from_low  # quick = pos
    - support_level_proximity
    - support_level_significance
    - drive_volume_climax  # order ending
    - catalyst_grade
    - catalyst_polarity
    - time_near_lows  # neg
    - rvol
    - setup_relation
    - market_alignment
    - sector_alignment
  preferred_windows: [open_drive]
  preferred_windows_ref: "First 15 minutes of the trading day"
  reference_stats: null
