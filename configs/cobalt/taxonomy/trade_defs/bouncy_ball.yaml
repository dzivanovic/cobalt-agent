# Source: TRADE-DEFS-BATCH2-v0_1.md §B.7 (SMB Bouncy Ball sheet — written
# short-side/breakdown; def side-symmetric, long = inverted).
# Schema: TAXONOMY-DRAFT-v0_6.md §10.1 (schema v0.3) + §A amendments
# (v0.7 extensions, TRADE-DEFS-BATCH2-v0_1.md §A).
trade_def:
  id: bouncy_ball
  name: Bouncy Ball
  aliases: [BB, "Bouncy Ball Breakdown"]
  family: [continuation, range_break]
  class: move2move  # trail-only exit
  valid_setups:
    - {setup_ref: gap_and_go, relation: with_trend}
    - {setup_ref: overextension, relation: countertrend}
    - {setup_ref: range_break, relation: with_trend}
  entry_mode: front_side
  preconditions:
    - expr: "InPlay.state == active"
    - expr: "Leg(impulse).direction == trade_direction"  # "significant move in one direction"
    - expr: "Range(micro).instantiated AND Range(micro).bound_type == converging"  # shallower bounces against a flat low
    - expr: "Range(micro).counter_pivot_count >= 2"  # config — >=2 lower highs (short) / higher lows (long)
  trigger:
    type: range_break
    params: {ref: "Range(micro).base"}
    confirmation_policy: {type: intrabar}  # "aggressively when the support breaks"
  stop:
    placement:
      type: structural_extreme
      ref: recent_lower_high  # A.7 — "just above the lower high"; sheet gives no number
      buffer: {type: fixed, cents: {value: 0.02, dynamic: false}}
      floor: config
    evaluation: touch
  stop_management:
    - type: time_stop
      duration_bars: {value: 2, dynamic: false}
      condition: "no progress from entry"  # "we do not want to see a rebid once support breaks"
      "on": {name: entry}
  exit:
    - fraction: 1.0
      target_type: trail
      params:
        conditions:
          - {type: prior_bar_break, n: 1}
          - {type: ma_close, ma: {value: EMA9, dynamic: false}}
        mode: any
      evaluation: close_through
      computable: cobalt  # "new 2-min high or reclaim of the 9 EMA" -> RULED: one working-TF bar
  on_cic: {triggers: [1, 2, 3, 4], action: exit_all}   # advisory
  max_attempts: {value: 1, dynamic: false}
  add_policy: {type: none}
  avoid:
    - expr: "Extension.instantiated on Leg(opening_drive)"  # "opening drop overextended from VWAP"
    - text: "rebid after the break (mechanised via time_stop)"
  quality_factors:
    - break_bar_volume_vs_prior  # increasing = pos
    - post_break_speed  # quick = pos
    - post_break_volume  # decreasing = neg
    - bounce_count
    - bounce_shallowing_rate
    - Range.duration
    - extension_distance_from_vwap  # neg
    - rvol
    - setup_relation
    - market_alignment
    - sector_alignment
  preferred_windows: [morning, midday, afternoon, close]
  preferred_windows_ref: "Late morning 10:30-11:59 · Mid-day 12-2 PM · Power hour 3 PM-close"
  reference_stats: null
