# Tunable registry — TAXONOMY-DRAFT-v0_7.md §13.1 (schema v0.4).
# Schema: src/cobalt/taxonomy/tunables.py (TunableRow / TunableRegistry).
#
# Seeded from the §13.1 table's DYNAMIC rows, plus `stop.buffer` (ruling
# 09-03, superseding ADR-0003's exclusion below). The other two
# NON-dynamic globals the table lists — working_timeframe, ma.fast/
# ma.slow — stay OUT: they stay in defaults.yaml as already built
# (§13.1's own instruction not to duplicate them); loader.resolve_cfg()
# falls back to defaults.yaml for those. `stop.buffer` is IN as of
# 09-03: RULED (Dejan) — default stop buffer = 0.02 everywhere, preset,
# tunable per trade, never hardcoded as a Pydantic default. Per-trade
# override = a `<trade_id>.stop.buffer` row (same hoist convention as
# every other per-trade key); the trades that carry one carry it in
# their own strategy note now (ADR-0008 D3 b.3), with their
# `sheet_value` record intact. `StopBuffer.cents` (trade_def.py)
# resolves via `cfg(key)` like any other tunable — no inline literal in
# a trade_def.
#
# Two other §13.1 rows are also excluded by the same dyn-only rule:
# catalyst.grade_min/_max (dyn: no (config), per_trade — a doctrine
# literal, not a replay-gated quantity) and
# <trade>.max_attempts / <trade>.reentry_window (dyn: no (doctrine)) —
# both already carried as Tunable[T] fields directly on their
# trade_defs, not duplicated here.
#
# `value: null` + `status: proposed` = the table's "—" cells (no number
# ruled yet). Per-trade keys are `<trade_id>.<field>` (the loader's
# hoist-key convention, §13.1 rules paragraph); global / per_indicator
# keys are bare. `consumers[]` carries the table's own consumer text.
tunables:
  # --- stop buffer (ruled 09-03: tunable, not a Pydantic constant) -------
  - key: stop.buffer
    value: 0.02
    unit: cents
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["all stops"]

  # --- global structure primitives -------------------------------------
  - key: range.micro.touches_per_side
    value: 2
    unit: count
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["micro-Range instantiation"]

  - key: pivot.n
    value: 2
    unit: bars
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["swing pivots"]

  - key: trendline.min_pivots
    value: 2
    unit: count
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    # Consumers are the trades whose defs reference this key. WHICH
    # trades those are is user data and lives in their notes (L31/L32) —
    # `cobalt validate` resolves it from the vault, so an engine row does
    # not have to carry a list of somebody's trade names.
    consumers: ["trade_defs referencing cfg(trendline.min_pivots)"]

  - key: range.wick_ratio_max
    value: null
    unit: ratio
    scope: global
    dynamic: true
    status: proposed
    source: dwv
    consumers: ["hitchhiker"]

  - key: break_volume_sigma_bars
    value: null
    unit: count
    scope: global
    dynamic: true
    status: proposed
    source: dwv
    consumers: ["big_dog"]

  - key: extension.path_b_atr
    value: 1.25
    unit: atr
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["Extension instantiation"]

  - key: extension.backside_hh_min
    value: 1
    unit: count
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["backside"]

  - key: extension.backside_hl_min
    value: 1
    unit: count
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["backside"]

  - key: range_break.failed_trap_bars
    value: null
    unit: bars
    scope: global
    dynamic: true
    status: proposed
    source: dwv
    consumers: ["Range Break (primitive)", "second_chance"]

  - key: range.counter_pivot_min
    value: 2
    unit: count
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["bouncy_ball"]

  - key: gap_retrace_pct_max
    value: 0.5
    unit: pct
    scope: global
    dynamic: true
    status: replay_pending
    source: ruling
    consumers: ["gap_give_and_go"]

  # --- per_indicator ------------------------------------------------------
  - key: flat_threshold.ema9
    value: null
    unit: ratio
    scope: per_indicator(ema9)
    dynamic: true
    status: proposed
    source: dwv
    consumers: ["fashionably_late"]

  - key: flat_threshold.vwap
    value: null
    unit: ratio
    scope: per_indicator(vwap)
    dynamic: true
    status: proposed
    source: dwv
    consumers: ["fashionably_late"]

  - key: dist.k.vwap
    value: null
    unit: atr
    scope: per_indicator(vwap)
    dynamic: true
    status: proposed
    source: dwv
    consumers: ["vwap_continuation"]

  # --- per_trade: range.duration_band [5,20] / >=45 / [3,7] --------------

  # --- per_trade: time_stop.bars (backside / bto / bouncy_ball) ----------

  # --- per_trade: bar_break_reverse.bars (ggg / big_dog) ------------------

  # --- per_trade: single-trade rows ---------------------------------------

  # --- per_trade: trail_conditions (the 6 trail-carrying trade_defs) -----

  # --- F1 session clock (Sprint 1, 2026-09-04) --------------------------
  # Charter §3 F1 / SPRINT-LADDER §S1. Every session boundary is a row
  # here with a named consumer — F16's law: no inline literal in a
  # predicate, and `cobalt.session` has nothing BUT boundary predicates.
  #
  # unit: time = an ET WALL-CLOCK time-of-day, "HH:MM", 24-hour. The
  # boundaries are defined in America/New_York and nowhere else; storage
  # is UTC timestamptz and the resolver converts (ADR-0007). A boundary
  # is INCLUSIVE of its own minute and exclusive of the next: 09:29:59 is
  # premarket, 09:30:00 is rth.
  #
  # dynamic: false / status: solidified — these are exchange facts, not
  # replay-gated quantities. They are rows because they must be
  # config-editable and consumer-traceable, not because a backtest will
  # move them. The NYSE calendar (holidays, early closes) is NOT here:
  # it is a list, not a threshold, and lives in
  # configs/cobalt/calendar/nyse-<year>.yaml.
  - key: session.premarket_open
    value: "04:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (premarket start)"]

  - key: session.rth_open
    value: "09:30"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (rth start)"]

  - key: session.rth_close
    value: "16:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (rth end / aftermarket start)"]

  - key: session.aftermarket_close
    value: "20:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (aftermarket end)"]

  - key: session.market_reset_open
    value: "20:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (market_reset start)",
                "cobalt.session.guard (hard block window)"]

  - key: session.market_reset_close
    value: "21:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (market_reset end)",
                "cobalt.session.guard (hard block window)"]

  # Early-close days (half days). SPRINT-LADDER §S1 / F1: rth ends 13:00
  # and aftermarket ends 17:00. market_reset is NOT moved — the archiver
  # still runs 20:30, so 17:00-20:00 on a half day resolves to overnight
  # by the ordinary boundary walk, not by a special case.
  - key: session.early_close.rth_close
    value: "13:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (rth end, early-close days)"]

  - key: session.early_close.aftermarket_close
    value: "17:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionClock (aftermarket end, early-close days)"]

  # F16 sweep (2026-09-04): the one genuine threshold F1 introduced
  # besides the boundaries themselves. `SessionBlockStore.count_last_24h`
  # had `timedelta(hours=24)` inline — the window the heartbeat asks
  # "how many writes were refused?" over. F18 (S1-P3) is the consumer;
  # the row ships now so the literal never exists.
  - key: session.blocks.heartbeat_window
    value: 1440
    unit: min
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.session.SessionBlockStore.count_over_window (F18 heartbeat)"]

  # --- F6 two-stage day mode (S1-P2, 2026-09-04) -----------------------
  # The 09:00 checkpoint's time is a boundary, exactly like the session
  # boundaries above: F16 forbids an inline literal in a predicate, and
  # "is it stage 1 or stage 2 yet" is a predicate. ET wall clock.
  - key: daymode.stage2_open
    value: "09:00"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.daymode (stage-1 -> stage-2 boundary)",
                "com.cobalt.daymode-propose (job schedule)"]

  # The running trade-count goal band the 09:00 reason cites. VALUES ARE
  # PLACEHOLDER — `value: null` + `status: proposed` is this registry's
  # own notation for "no number ruled yet" (see the header), and it is
  # the honest state: the band is a trading rule and it belongs to the
  # RULES ENGINE design session, not to a build prompt.
  #
  # Until it is ruled, an unruled band is itself an adverse signal in
  # cobalt.daymode.propose — it pins the proposal to the floor rather
  # than letting an invented number justify a bigger rung. Conservative
  # in the only direction it is safe to be wrong.
  - key: daymode.trade_count_band.min
    value: null
    unit: count
    scope: global
    dynamic: true
    status: proposed
    source: ruling
    consumers: ["F6 day-mode proposal (cobalt.daymode.propose)"]

  - key: daymode.trade_count_band.max
    value: null
    unit: count
    scope: global
    dynamic: true
    status: proposed
    source: ruling
    consumers: ["F6 day-mode proposal (cobalt.daymode.propose)"]

  # --- F17 task integrity / F18 heartbeat (S1-P3, 2026-09-04) ----------
  # Every threshold these two features EVALUATE is a row here with a
  # named consumer. Per-job timeouts and schedules are NOT here: those
  # are per-job data, not thresholds, and they live in
  # configs/cobalt/jobs.yaml under their own Pydantic schema (which
  # `cobalt validate` also checks). The rows below are the numbers the
  # code compares against.

  - key: heartbeat.interval_min
    value: 15
    unit: min
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.heartbeat (probe cadence)",
                "com.cobalt.heartbeat (job schedule, jobs.yaml)",
                "F18 'red within one interval' — this IS the interval"]

  - key: heartbeat.green_summary_at
    value: "17:30"
    unit: time
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.heartbeat (the one green DM per day)"]

  - key: heartbeat.backup_max_age_min
    value: 1560
    unit: min
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    # 26 h, not 24: the backup runs at 21:40 and a snapshot that starts
    # a few minutes late must not paint the beat red the following
    # night. `archiver_freshness` used to have a matching flat
    # `archiver_max_age_min` window (deleted 2026-09-06) — it painted
    # every Sat/Sun red once a Friday-registered row aged past it,
    # because a flat age window cannot tell a weekday-cadence gap from a
    # genuine miss. The archiver checks against its own cadence instead
    # (`jobs.missed_grace_min`, via `cobalt.jobs.watchdog.is_missed`).
    # `backup` stays on a flat window because it runs every day —
    # weekends included — so there is no cadence gap for a flat window
    # to misread.
    consumers: ["cobalt.heartbeat.probes.backup_freshness (stale = red)"]

  - key: heartbeat.probe_timeout_s
    value: 5
    unit: duration
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.heartbeat.probes (sheet HTTP, launchctl, database)"]

  # --- F18's second channel: email (S1-P4, 2026-09-08) ------------------
  # Both rows are numbers the CODE COMPARES OR BINDS against, which is
  # what makes them tunables rather than per-job data.

  - key: notify.email.auth_port
    value: 8765
    unit: count
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    # FIXED, not ephemeral, and that is the whole reason it is a row.
    # Google requires every redirect URI to be pre-registered on the
    # OAuth client, so `run_local_server(port=0)` — the library default —
    # picks a port that is not registered and the consent screen fails
    # with redirect_uri_mismatch. The port must be knowable BEFORE the
    # client is registered, by a human editing the Google console, which
    # means it has to live somewhere a human reads. `unit: count` is the
    # least-wrong member of TunableUnit: a port is a bare number with no
    # dimension, and inventing a PORT unit for one row would change the
    # taxonomy schema for no analytical gain.
    consumers: ["cobalt.notify.email.run_consent_flow (loopback bind)",
                "the Desktop OAuth client's registered redirect URI (human-entered)"]

  - key: notify.email.timeout_s
    value: 20
    unit: duration
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    # Longer than heartbeat.probe_timeout_s (5 s) ON PURPOSE. A probe
    # that hangs delays the beat; this is the ALERT ITSELF, and a red
    # that gave up after 5 seconds on a slow uplink is a red nobody
    # receives. Still well inside the 900 s beat interval, so a hung
    # send can never overlap the next beat.
    consumers: ["cobalt.notify.email.send_email (token refresh + Gmail send)"]

  - key: jobs.heartbeat_fraction
    value: 3
    unit: ratio
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.jobs.wrapper (stamp at least every timeout_s / this)",
                "cobalt.jobs.watchdog (stale-heartbeat threshold)"]

  - key: jobs.missed_grace_min
    value: 30
    unit: min
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers: ["cobalt.jobs.watchdog (a one-shot past its cadence by this much = MISSED)"]

  # --- F16 hygiene rider (ADR-0008 D7, 2026-09-08) ----------------------
  # The Mattermost timeout was a `timeout_s:` field on MattermostConfig,
  # a number living in a config file that F16's sweep had already moved
  # everywhere else (notify.email.auth_port, notify.email.timeout_s). One
  # channel reading its numbers from a tunables row while the other read
  # its own from a YAML field was two answers to "where does a number
  # live" — this is the second one being retired.
  - key: notify.mattermost.timeout_s
    value: 10
    unit: duration
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers:
      - "cobalt.notify.mattermost (/users/me, /users/username, /channels/direct, /posts)"

  # --- seat usage (ops/herdr-usage, 2026-09-08) -------------------------
  # The seat-usage report's cadence and its window. BOTH are read by the
  # job's schedule (configs/cobalt/jobs.yaml) AND expanded into
  # com.cobalt.seat-usage.plist's StartCalendarInterval array, because
  # launchd cannot read a tunables row. The suite compares the two, so a
  # change here that is not mirrored into the plist fails loudly rather
  # than being discovered by a report that stopped updating.
  - key: seat_usage.window
    value: "06:00-23:00"
    unit: window
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    # 06:00 is before the first pre-market work of the day; 23:00 is the
    # last hour a seat is realistically still running. The hours outside
    # it are not "cheap to cover" — they are hours in which a run would
    # rewrite the day's row with no new data and put a diff in the audit
    # log for nothing.
    consumers:
      - "cobalt.jobs.config.Schedule (due_now, window_opened_at, calendar_entries)"
      - "cobalt.jobs.watchdog.is_missed (an overnight gap is the schedule, not a miss)"
      - "cobalt.heartbeat.probes.seat_usage (the probe only asks INSIDE the window)"
      - "ops/com.cobalt.seat-usage.plist (StartCalendarInterval, mirrored)"

  - key: seat_usage.interval_min
    value: 60
    unit: min
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    consumers:
      - "cobalt.jobs.config.Schedule (interval_minutes, calendar_entries)"
      - "cobalt.jobs.watchdog.is_missed (two intervals of slack)"
      - "ops/com.cobalt.seat-usage.plist (one entry per interval, mirrored)"

  - key: seat_usage.max_age_min
    value: 120
    unit: min
    scope: global
    dynamic: false
    status: solidified
    source: ruling
    # Two intervals, and deliberately the same slack the watchdog gives
    # an interval job: one run may be skipped without anyone being told,
    # two in a row means the report is going stale and the number Dejan
    # reads at the end of the day is wrong.
    consumers:
      - "cobalt.heartbeat.probes.seat_usage (last run age, asked only inside the window)"
