    source: dwv
    consumers: ["bella_fade"]

  # --- per_trade: trail_conditions (the 6 trail-carrying trade_defs) -----
  # Capability SET only (the sheet's trail options); per-instance
  # selection (mode: select) is card data, not a tunable — §13.1 note.
  - key: second_chance.trail_conditions
    value: ["ma_close ma.fast", "ma_close ma.slow", "prior_bar_break 1"]
    unit: label
    scope: per_trade(second_chance)
    dynamic: true
    status: replay_pending
    source: sheet
    consumers: ["second_chance"]

  - key: rubberband.trail_conditions
    value: ["ma_close ma.fast"]
