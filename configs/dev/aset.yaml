# ASET sheet config (dev). Pydantic-validated on load; bad file crashes.
#
# account_size below is an EXAMPLE — put real numbers in
# configs/dev/aset.local.yaml (gitignored). The local file REPLACES this
# one entirely, so it must be a COMPLETE config (all keys).
#
# daily stop prefill = daily_stop_default if set (morning-set value),
# else account_size / 100 for now (TEMP override, 2026-08-25, of the
# ruled account/50 Daily-Stop Model — see engine.temp_prefill_daily_stop)
# — always clamped to broker_hard_stop; anything above the cap is refused.
account_size: 10000
broker_hard_stop: 430
# daily_stop_default: 400
db_name: cobalt_dev

# "Save to Daily Note" target. Paths/patterns config-only, nothing
# hardcoded. Currently the docs/ playground vault (live-vault migration
# is a scheduled design decision). Writes are APPEND-ONLY and gated:
# the target file must be git-ignored or the write is refused.
daily_note:
  vault_path: docs
  inbox_dir: "0 - Inbox"
  filename_pattern: "%Y-%m-%d.md"

# Server bind. "loopback" (default) = 127.0.0.1 only, this machine only.
# "lan" = 0.0.0.0, reachable from other devices on the home network (e.g.
# Dejan's Windows trading PC — same home network, NOT Tailscale) at
# http://<mac-lan-ip>:<port>; the reachable URL(s) print on startup.
# WARNING: "lan" exposes this page with NO authentication to anyone on
# the local network. Acceptable for now — an access token is a backlog
# item (docs/00 - Project/BACKLOG.md).
server:
  bind: loopback
  port: 5010
