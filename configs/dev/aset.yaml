# ASET sheet config (dev). Pydantic-validated on load; bad file crashes.
#
# account_size below is an EXAMPLE — put real numbers in
# configs/dev/aset.local.yaml (gitignored). The local file REPLACES this
# one entirely, so it must be a COMPLETE config (all keys).
#
# account_size is not used by the current sheet-mode fixed-dollar sizer
# (iteration 4) — kept for the future 1%-of-account computed mode. Sheet
# mode's actual dollar-risk-per-grade table lives in
# configs/cobalt/aset.yaml (full/half, mirrors Dejan's DAS hotkey files).
account_size: 10000
db_name: cobalt_dev

# "Save to Daily Note" target. Vault ROOT comes from
# configs/dev/vault.yaml (cobalt.vault — the one resolver), never
# configured here. daily_notes_dir is relative to that root. Writes are
# APPEND-ONLY and gated: the resolved target must be OUTSIDE the repo
# working tree or the write is refused (the vault lives outside the
# repo — that's the safety property).
daily_note:
  daily_notes_dir: "1 - Trading/1- Daily Notes"
  filename_pattern: "%Y-%m-%d.md"
  # LAW L28 containment lever (2026-09-03): false keeps the sheet
  # serving and the card persisting to Postgres, and turns the
  # daily-note write into a loud, logged no-op with a banner on the
  # page. There was no way to do that on 09-03 — the whole LaunchAgent
  # had to be stopped. Default true.
  write_enabled: true

# Server bind. "loopback" (default) = 127.0.0.1 only, this machine only.
# "lan" = 0.0.0.0, reachable from other devices on the home network (e.g.
# Dejan's Windows trading PC — same home network, NOT Tailscale) at
# http://<mac-lan-ip>:<port>; the reachable URL(s) print on startup.
# WARNING: "lan" exposes this page with NO authentication to anyone on
# the local network. Acceptable for now — an access token is a backlog
# item (docs/00 - Project/BACKLOG.md).
server:
  bind: loopback
  port: 5010

# Slice 2.1a (2026-08-31) typo guards — hard rejects on the card, not
# warnings. This section is optional; omitting it takes these same
# defaults (AsetConfig.validation's Pydantic defaults).
# max_stop_distance_pct: catches a fat-fingered stop (D3 — a 32% PCG
#   stop typo, 17.72 meant to be 13.72, went unflagged).
# max_fill_distance_pct: catches a fat-fingered actual-fill entry (D2 —
#   2518.91 entered against a 218.595 entry, computed to 0 shares and
#   was persisted twice before the real 218.91 fill came in).
validation:
  max_stop_distance_pct: 10
  max_fill_distance_pct: 5
